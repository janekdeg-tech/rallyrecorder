  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --paper:#f7f4ef; --card:#fffdfa; --ink:#2b2a27; --muted:#8a857c; --faint:#a8a29a;
    --clay:#c8654a; --sage:#7e9a7a; --line:#e9e3da;
    --tabh:74px;
  }
  html,body{height:100%}
  body{
    background:var(--paper);color:var(--ink);
    font-family:'Inter',-apple-system,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .scroll{flex:1;overflow-y:auto;padding:0 20px calc(var(--tabh) + 24px)}

  /* header */
  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
  .brand{display:flex;align-items:center;gap:9px}
  .mark{width:28px;height:28px;border-radius:50%;background:var(--clay);position:relative;flex:none}
  .mark::after{content:"";position:absolute;left:50%;top:5px;bottom:5px;width:2.5px;background:var(--card);border-radius:2px;transform:translateX(-50%) rotate(30deg)}
  .brand b{font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:600;letter-spacing:-.01em}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--sage);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:600}

  /* greeting */
  .greet{padding:22px 2px 20px}
  .greet .day{color:var(--muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
  .greet h1{font-family:'Fraunces',Georgia,serif;font-size:31px;font-weight:600;line-height:1.2;letter-spacing:-.02em;margin-top:7px}
  .greet h1 em{font-style:italic;color:var(--clay)}

  /* the one button */
  .upload{
    width:100%;display:flex;align-items:center;justify-content:center;gap:12px;
    background:var(--clay);color:#fff;border:none;border-radius:20px;cursor:pointer;
    font-family:inherit;font-size:18px;font-weight:600;letter-spacing:-.01em;
    height:76px;
    box-shadow:0 10px 22px -10px rgba(200,101,74,.85);
  }
  .upload:active{transform:translateY(1px)}
  .upload svg{width:22px;height:22px}
  .under{color:var(--faint);font-size:12.5px;text-align:center;margin-top:11px}

  /* continue card */
  .continue{
    margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:14px;display:flex;align-items:center;gap:13px;
  }
  .continue .thumb{width:56px;height:56px;border-radius:13px;background:#ece5db;flex:none;display:grid;place-items:center;color:#b3aa9d}
  .continue .thumb svg{width:19px;height:19px}
  .continue .t{flex:1;min-width:0}
  .continue .t span{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  .continue .t b{display:block;font-size:15.5px;font-weight:600;margin:3px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar{height:5px;border-radius:3px;background:#ece5db;overflow:hidden}
  .bar i{display:block;height:100%;width:64%;background:var(--sage);border-radius:3px}
  .continue .go{width:38px;height:38px;border-radius:50%;background:#f4ece7;color:var(--clay);display:grid;place-items:center;flex:none}
  .continue .go svg{width:16px;height:16px}

  /* recent */
  .sec{display:flex;align-items:baseline;justify-content:space-between;margin:30px 2px 12px}
  .sec h2{font-family:'Fraunces',Georgia,serif;font-size:18px;font-weight:600}
  .sec a{color:var(--muted);font-size:13.5px;text-decoration:none}
  .row{
    display:flex;align-items:center;gap:13px;background:var(--card);
    border:1px solid var(--line);border-radius:18px;padding:13px 14px;margin-bottom:10px;
  }
  .row .thumb{width:50px;height:50px;border-radius:13px;background:#ece5db;flex:none;display:grid;place-items:center;color:#b3aa9d}
  .row .thumb svg{width:17px;height:17px}
  .row .t{flex:1;min-width:0}
  .row .t b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .t span{color:var(--muted);font-size:12.5px}
  .row .t span i{font-style:normal;color:var(--faint)}
  .count{text-align:right;flex:none}
  .count b{display:block;font-size:16px;font-weight:600;color:var(--sage)}
  .count span{font-size:11px;color:var(--faint);letter-spacing:.04em}

  /* tab bar */
  .tabs{
    flex:none;height:var(--tabh);background:rgba(255,253,250,.94);
    border-top:1px solid var(--line);backdrop-filter:blur(10px);
    display:flex;align-items:flex-start;padding-top:11px;
  }
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--faint);text-decoration:none;font-size:11px;font-weight:500}
  .tab svg{width:21px;height:21px}
  .tab.on{color:var(--clay)}
</style>
</head>
