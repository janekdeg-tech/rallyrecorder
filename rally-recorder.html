<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Next Point — Rally Recorder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #1e1e1e;
    color: #e8e8e8;
    min-height: 100vh;
  }
  .app { display: flex; height: 100vh; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .video-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
    position: relative;
  }
  video { width: 100%; height: 100%; object-fit: contain; }
  .empty-hint { color: #888; font-size: 18px; text-align: center; padding: 20px; }
  .load-error { color: #ef5350; font-size: 13px; text-align: center; padding: 8px; position: absolute; bottom: 90px; left: 12px; right: 12px; background: rgba(0,0,0,.6); border-radius: 8px; z-index: 6; }

  /* ---------- Overlay: top ---------- */
  .top-overlay {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 12px;
    background: linear-gradient(rgba(0,0,0,.75), transparent);
    z-index: 5;
  }
  .top-overlay button {
    background: rgba(0,0,0,.6); color: #fff;
    border: 1px solid rgba(255,255,255,.35); border-radius: 8px;
    padding: 8px 12px; font-size: 14px; cursor: pointer; min-height: 44px;
  }
  .top-overlay button:hover { background: rgba(255,255,255,.22); }
  .top-overlay button:disabled { opacity: .4; cursor: not-allowed; }
  .file-btn { position: relative; display: inline-block; overflow: hidden; }
  .file-btn input[type="file"] {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; cursor: pointer; z-index: 2;
  }
  .file-btn-label {
    display: inline-block;
    background: rgba(0,0,0,.6); color: #fff;
    border: 1px solid rgba(255,255,255,.35); border-radius: 8px;
    padding: 8px 12px; font-size: 14px; min-height: 44px; line-height: 28px;
    pointer-events: none;
  }
  .file-btn:hover .file-btn-label { background: rgba(255,255,255,.22); }
  .speed-box { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #ddd; }
  .speed-box input[type=range] { width: 110px; }
  .time-display {
    font-family: Consolas, monospace;
    font-size: 14px; color: #fff; background: rgba(0,0,0,.5);
    padding: 6px 10px; border-radius: 8px;
  }
  .let-hint { display: none; color: #ffeb3b; font-size: 13px; background: rgba(0,0,0,.5); padding: 6px 10px; border-radius: 8px; }
  .let-hint.on { display: inline; }

  /* ---------- Overlay: bottom ---------- */
  .bottom-overlay {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 10px;
    padding: 16px 12px 12px;
    background: linear-gradient(transparent, rgba(0,0,0,.82));
    z-index: 5;
  }
  .transport { display: flex; align-items: center; gap: 8px; }
  .transport button {
    background: rgba(0,0,0,.6); color: #fff;
    border: 1px solid rgba(255,255,255,.35); border-radius: 8px;
    padding: 10px 12px; font-size: 14px; cursor: pointer; min-height: 48px; min-width: 48px;
    white-space: nowrap;
  }
  .transport button:hover { background: rgba(255,255,255,.22); }
  .transport button:disabled { opacity: .4; cursor: not-allowed; }
  #letBtn { background: #5a5427; border-color: #d4b106; }
  #letBtn.marking {
    background: #7a6a1f;
    border-color: #ffeb3b;
    box-shadow: 0 0 0 3px rgba(255, 235, 59, .3);
  }

  /* ---------- Live rally timer ---------- */
  .rally-timer {
    font-family: Consolas, monospace;
    font-size: 24px; font-weight: 700;
    color: #4caf50;
    background: rgba(0,0,0,.5);
    border: 1px solid rgba(76,175,80,.6);
    border-radius: 10px;
    padding: 8px 16px;
    text-align: center;
    min-width: 96px;
  }
  .rally-timer.rec { color: #ff5252; border-color: rgba(255,82,82,.7); animation: pulse 1.2s infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,82,82,.5); }
    50% { box-shadow: 0 0 0 8px rgba(255,82,82,0); }
  }

  /* ---------- Player buttons ---------- */
  .players { display: flex; flex-direction: column; gap: 8px; }
  .players button {
    min-height: 52px; min-width: 92px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    border-radius: 10px; border: 1px solid #2f9e52;
    background: #1d6f3c; color: #fff;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .players button small { font-size: 11px; font-weight: 600; opacity: .9; }
  .players button:hover { filter: brightness(1.12); }
  .players button:disabled { opacity: .4; cursor: not-allowed; }
  .players button.recording { background: #a3312b; border-color: #e0504a; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 340px; min-width: 340px;
    border-left: 1px solid #333;
    background: #252526;
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .sidebar h2 { font-size: 15px; color: #bbb; text-transform: uppercase; letter-spacing: 1px; }
  .sidebar-header { display: flex; justify-content: space-between; align-items: center; }
  #copyBtn {
    background: #3a3a3a; color: #e8e8e8; border: 1px solid #555; border-radius: 6px;
    padding: 8px 12px; font-size: 13px; cursor: pointer; min-height: 40px;
  }
  #copyBtn:hover { background: #4a4a4a; }
  #ralliesContainer { flex: 1; overflow-y: auto; min-height: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead th {
    text-align: left; color: #999; font-weight: 600;
    padding: 6px 8px; border-bottom: 1px solid #444;
  }
  tbody td { padding: 6px 8px; border-bottom: 1px solid #333; }
  tbody tr.active-rally { background: rgba(239, 83, 80, .12); }
  .num-cell { font-weight: 600; }
  tbody.let-mode .num-cell { cursor: pointer; color: #ffeb3b; text-decoration: underline; }
  .let-cell { text-align: center; }
  .let-tag {
    display: inline-block; background: #7a6a1f; color: #ffeb3b;
    font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 10px; cursor: pointer;
  }
  .let-tag:hover { background: #8a7a2a; }
  .time-cell { font-family: Consolas, monospace; cursor: text; }
  .time-cell:hover { background: #3a3a3a; }
  .time-input {
    width: 100%; font-family: Consolas, monospace; font-size: 14px;
    background: #3a3a3a; color: #e8e8e8;
    border: 1px solid #4caf50; border-radius: 4px; padding: 2px 4px; outline: none;
  }
  .delete-btn {
    background: transparent !important; border: none !important; color: #e05c5c;
    font-weight: 700; padding: 6px 10px !important; font-size: 13px !important;
    min-height: 40px; min-width: 40px; cursor: pointer;
  }
  .delete-btn:hover { color: #fff; background: #7a2323 !important; }
  .no-rallies { color: #777; font-size: 13px; font-style: italic; }
  .footer-note { color: #666; font-size: 12px; flex: none; padding-top: 8px; }

  /* ---------- Portrait phones ---------- */
  @media (max-width: 820px) {
    .app { flex-direction: column; height: auto; min-height: 100vh; }
    .video-wrap { height: 46vh; flex: none; }
    .sidebar { width: 100%; min-width: 0; border-left: none; border-top: 1px solid #333; }
    .top-overlay button, .transport button { min-height: 44px; min-width: 44px; }
    .players button { min-width: 78px; }
    .rally-timer { font-size: 20px; min-width: 84px; padding: 6px 12px; }
    .time-cell { padding: 10px 8px; }
    .delete-btn { min-width: 44px !important; min-height: 44px !important; }
  }

  /* ---------- Landscape phones: full-screen video, list hidden ---------- */
  @media (orientation: landscape) and (max-height: 700px) {
    .app { flex-direction: row; height: 100vh; }
    .sidebar { display: none; }
    .video-wrap { flex: 1; }
    .top-overlay { padding: 8px 10px; }
    .bottom-overlay { padding: 12px 10px 10px; }
    .transport button { min-height: 44px; padding: 8px 10px; }
    .players button { min-height: 48px; min-width: 84px; }
    .rally-timer { font-size: 18px; min-width: 76px; padding: 5px 10px; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="main">
      <div class="video-wrap">
        <video id="video" preload="metadata" playsinline webkit-playsinline></video>
        <div id="emptyHint" class="empty-hint">No video loaded — tap "Open Video"</div>
        <div id="loadError" class="load-error" hidden></div>

        <div class="top-overlay">
          <span class="file-btn">
            <input type="file" id="fileInput" accept="video/*">
            <span class="file-btn-label">Open Video&#8230;</span>
          </span>
          <div class="speed-box">
            <label for="speedSlider">Speed</label>
            <input type="range" id="speedSlider" min="0.25" max="3" step="0.25" value="1" disabled>
            <span id="speedLabel">1.0x</span>
          </div>
          <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
          <span class="let-hint" id="letHint">Click a rally number to mark it as LET</span>
        </div>

        <div class="bottom-overlay">
          <div class="transport">
            <button id="backBtn" disabled title="Back 5 seconds">&#9198; 5s</button>
            <button id="playBtn" disabled title="Play / Pause">&#9654;</button>
            <button id="fwdBtn" disabled title="Forward 5 seconds">5s &#9197;</button>
            <button id="letBtn" disabled title="Mark rally as a let">LET</button>
          </div>
          <div class="rally-timer" id="rallyTimer">0:00</div>
          <div class="players">
            <button id="p1Btn" disabled><b>Player 1</b><small>Serve</small></button>
            <button id="p2Btn" disabled><b>Player 2</b><small>Serve</small></button>
          </div>
        </div>
      </div>
    </div>

    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Rallies</h2>
        <button id="copyBtn">Copy List</button>
      </div>
      <div id="ralliesContainer"></div>
      <div class="footer-note">Click a start/end time to edit it. Click let to remove it. Click X to delete a rally.</div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const emptyHint = document.getElementById('emptyHint');
    const loadError = document.getElementById('loadError');
    const fileInput = document.getElementById('fileInput');
    const backBtn = document.getElementById('backBtn');
    const playBtn = document.getElementById('playBtn');
    const fwdBtn = document.getElementById('fwdBtn');
    const letBtn = document.getElementById('letBtn');
    const speedSlider = document.getElementById('speedSlider');
    const speedLabel = document.getElementById('speedLabel');
    const timeDisplay = document.getElementById('timeDisplay');
    const rallyTimer = document.getElementById('rallyTimer');
    const p1Btn = document.getElementById('p1Btn');
    const p2Btn = document.getElementById('p2Btn');
    const letHint = document.getElementById('letHint');
    const ralliesContainer = document.getElementById('ralliesContainer');
    const copyBtn = document.getElementById('copyBtn');

    let rallies = [];
    let activeRally = null;
    let letMode = false;
    let loadAttempted = false;

    function setLetMode(on) {
      letMode = on;
      letBtn.classList.toggle('marking', on);
      letHint.classList.toggle('on', on);
      const tbody = ralliesContainer.querySelector('tbody');
      if (tbody) tbody.classList.toggle('let-mode', on);
    }

    function formatTime(sec) {
      if (!isFinite(sec) || sec < 0) sec = 0;
      sec = Math.floor(sec);
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const pad = (n) => String(n).padStart(2, '0');
      return h > 0 ? h + ':' + pad(m) + ':' + pad(s) : m + ':' + pad(s);
    }

    function parseTime(str) {
      const t = str.trim();
      if (t === '') return null;
      const parts = t.split(':').map(function (p) { return parseInt(p, 10); });
      if (parts.some(isNaN) || parts.length < 1 || parts.length > 3) return null;
      let total = 0;
      for (let i = 0; i < parts.length; i++) {
        total = total * 60 + parts[i];
      }
      if (total < 0) return null;
      return total;
    }

    // ---- Video loading ----
    fileInput.addEventListener('change', function () {
      const file = fileInput.files[0];
      if (!file) return;
      // Reset so picking the same file (or retrying a failed pick) fires change again.
      fileInput.value = '';
      loadFileIntoVideo(file);
    });
    fileInput.addEventListener('cancel', function () {
      loadAttempted = false;
    });

    let lastFile = null;
    let loadFallbackTimer = null;
    let metadataFired = false;

    function isIOS() {
      return /iP(hone|od|ad)/i.test(navigator.userAgent);
    }

    function clearCurrentVideo() {
      while (video.firstChild) video.removeChild(video.firstChild);
      video.removeAttribute('src');
      video.srcObject = null;
      video.load();
    }

    function loadFileIntoVideo(file) {
      loadAttempted = true;
      lastFile = file;
      metadataFired = false;
      clearTimeout(loadFallbackTimer);
      clearCurrentVideo();
      loadError.hidden = true;
      emptyHint.textContent = 'Loading video\u2026';
      emptyHint.style.display = '';

      // iOS Safari has bugs loading blob: URLs into video.src; assigning the
      // raw File to srcObject works reliably there. If metadata never arrives,
      // fall back to a blob URL on a nested <source> element.
      if (isIOS()) {
        try {
          video.srcObject = file;
          video.load();
          loadFallbackTimer = setTimeout(loadFromBlobUrl, 4000);
          return;
        } catch (e) {
          // fall through to the <source> approach below
        }
      }
      loadFromBlobUrl();
    }

    function loadFromBlobUrl() {
      if (!lastFile) return;
      const url = URL.createObjectURL(lastFile);
      const source = document.createElement('source');
      source.src = url;
      source.type = lastFile.type || 'video/mp4';
      video.appendChild(source);
      video.load();
    }

    video.addEventListener('loadedmetadata', function () {
      loadAttempted = false;
      metadataFired = true;
      clearTimeout(loadFallbackTimer);
      emptyHint.style.display = 'none';
      emptyHint.textContent = 'No video loaded \u2014 tap \u201COpen Video\u201D';
      video.style.display = 'block';
      loadError.hidden = true;
      enableControls();
      updateTimes();
    });
    video.addEventListener('error', function () {
      if (!loadAttempted) return;
      clearTimeout(loadFallbackTimer);
      emptyHint.style.display = 'none';
      const code = video.error ? video.error.code : 0;
      if (code === 4) {
        loadError.textContent = 'This video (likely an HEVC recording from your Photo Library) can\u2019t be played here. Try picking it from the Files app, or convert it to MP4 (H.264).';
      } else {
        loadError.textContent = 'Could not load that video. Try picking it again (MP4 / H.264 works best on iPhone).';
      }
      loadError.hidden = false;
    });

    // ---- Enable controls once video is ready ----
    function enableControls() {
      backBtn.disabled = false;
      playBtn.disabled = false;
      fwdBtn.disabled = false;
      speedSlider.disabled = false;
      letBtn.disabled = false;
      p1Btn.disabled = false;
      p2Btn.disabled = false;
      playBtn.textContent = '\u25B6';
    }

    // ---- Time updates ----
    function updateTimes() {
      const dur = isFinite(video.duration) ? video.duration : 0;
      timeDisplay.textContent = formatTime(video.currentTime) + ' / ' + formatTime(dur);
      updateRallyTimer();
    }
    function updateRallyTimer() {
      if (activeRally) {
        rallyTimer.textContent = formatTime(video.currentTime - activeRally.start);
        rallyTimer.classList.add('rec');
      } else {
        rallyTimer.textContent = '0:00';
        rallyTimer.classList.remove('rec');
      }
    }
    video.addEventListener('timeupdate', updateTimes);

    // ---- Transport controls ----
    backBtn.addEventListener('click', function () {
      video.currentTime = Math.max(0, video.currentTime - 5);
    });
    fwdBtn.addEventListener('click', function () {
      video.currentTime = Math.min(video.duration || 0, video.currentTime + 5);
    });
    playBtn.addEventListener('click', function () {
      if (video.paused) {
        video.play();
        playBtn.textContent = '\u23F8';
      } else {
        video.pause();
        playBtn.textContent = '\u25B6';
      }
    });
    video.addEventListener('play', function () { playBtn.textContent = '\u23F8'; });
    video.addEventListener('pause', function () { playBtn.textContent = '\u25B6'; });

    speedSlider.addEventListener('input', function () {
      video.playbackRate = parseFloat(speedSlider.value);
      speedLabel.textContent = speedSlider.value + 'x';
    });

    // ---- Player buttons: serve to start, win to end ----
    p1Btn.addEventListener('click', function () { playerClick(1); });
    p2Btn.addEventListener('click', function () { playerClick(2); });

    function playerClick(player) {
      if (!activeRally) {
        setLetMode(false);
        activeRally = { start: video.currentTime, end: null, server: player, winner: null, let: false };
        rallies.push(activeRally);
      } else {
        activeRally.end = video.currentTime;
        activeRally.winner = player;
        activeRally = null;
      }
      updatePlayerButtons();
      renderTable();
      scrollListToBottom();
    }

    function updatePlayerButtons() {
      const rec = !!activeRally;
      p1Btn.classList.toggle('recording', rec);
      p2Btn.classList.toggle('recording', rec);
      p1Btn.querySelector('small').textContent = rec ? 'Win point' : 'Serve';
      p2Btn.querySelector('small').textContent = rec ? 'Win point' : 'Serve';
      updateRallyTimer();
    }

    // ---- LET button: end the rally as a let (no point) ----
    letBtn.addEventListener('click', function () {
      if (activeRally) {
        activeRally.end = video.currentTime;
        activeRally.let = true;
        activeRally.winner = null;
        activeRally = null;
        updatePlayerButtons();
        renderTable();
        scrollListToBottom();
      } else if (letMode) {
        setLetMode(false);
      } else {
        if (rallies.length === 0) return;
        setLetMode(true);
      }
    });

    // ---- Rally table ----
    function servePrefix(r) { return r.server ? '(' + r.server + ')' : ''; }
    function winnerPrefix(r) { return r.winner ? '(' + r.winner + ')' : ''; }

    function renderTable() {
      if (rallies.length === 0) {
        ralliesContainer.innerHTML = '<div class="no-rallies">No rallies recorded yet.</div>';
        return;
      }
      let html = '<table><thead><tr><th>Rally</th><th>Start</th><th>End</th><th>Let</th><th></th></tr></thead>';
      html += '<tbody' + (letMode ? ' class="let-mode"' : '') + '>';
      rallies.forEach(function (r, i) {
        const isActive = r === activeRally;
        html += '<tr data-index="' + i + '"' + (isActive ? ' class="active-rally"' : '') + '>' +
          '<td class="num-cell" title="' + (letMode ? 'Click to mark as LET' : '') + '">' + (i + 1) + '</td>' +
          '<td class="time-cell" data-field="start">' + servePrefix(r) + formatTime(r.start) + '</td>' +
          '<td class="time-cell" data-field="end">' + winnerPrefix(r) + (r.end !== null ? formatTime(r.end) : '\u2014') + '</td>' +
          '<td class="let-cell">' + (r.let ? '<span class="let-tag" title="Click to remove LET">let</span>' : '') + '</td>' +
          '<td><button class="delete-btn" title="Delete rally">X</button></td>' +
          '</tr>';
      });
      html += '</tbody></table>';
      ralliesContainer.innerHTML = html;
    }

    function scrollListToBottom() {
      ralliesContainer.scrollTop = ralliesContainer.scrollHeight;
    }

    // ---- Edit time cells (event delegation) ----
    ralliesContainer.addEventListener('click', function (e) {
      const cell = e.target.closest('.time-cell');
      if (!cell) return;
      startEdit(cell);
    });

    function startEdit(cell) {
      if (cell.querySelector('input')) return;
      const index = parseInt(cell.parentElement.dataset.index, 10);
      const field = cell.dataset.field;
      const rally = rallies[index];
      if (!rally) return;

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'time-input';
      input.value = field === 'start' ? formatTime(rally.start) : (rally.end !== null ? formatTime(rally.end) : '');
      cell.textContent = '';
      cell.appendChild(input);
      input.focus();
      input.select();

      let done = false;
      function commit() {
        if (done) return;
        done = true;
        const val = parseTime(input.value);
        if (val !== null) {
          rally[field] = val;
        }
        renderTable();
      }
      function cancel() {
        if (done) return;
        done = true;
        renderTable();
      }
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') commit();
        else if (e.key === 'Escape') cancel();
      });
    }

    // ---- Delete rallies (event delegation) ----
    ralliesContainer.addEventListener('click', function (e) {
      const btn = e.target.closest('.delete-btn');
      if (!btn) return;
      const index = parseInt(btn.closest('tr').dataset.index, 10);
      const rally = rallies[index];
      if (rally === activeRally) {
        activeRally = null;
        updatePlayerButtons();
      }
      rallies.splice(index, 1);
      if (letMode && rallies.length === 0) setLetMode(false);
      renderTable();
    });

    // ---- Mark as LET via rally number (only in let mode) ----
    ralliesContainer.addEventListener('click', function (e) {
      const numCell = e.target.closest('.num-cell');
      if (!numCell || !letMode) return;
      const index = parseInt(numCell.closest('tr').dataset.index, 10);
      const rally = rallies[index];
      if (!rally) return;
      rally.let = true;
      setLetMode(false);
      renderTable();
    });

    // ---- Remove LET marker ----
    ralliesContainer.addEventListener('click', function (e) {
      const tag = e.target.closest('.let-tag');
      if (!tag) return;
      const index = parseInt(tag.closest('tr').dataset.index, 10);
      const rally = rallies[index];
      if (!rally) return;
      rally.let = false;
      renderTable();
    });

    // ---- Copy list ----
    copyBtn.addEventListener('click', function () {
      const lines = [];
      rallies.forEach(function (r, i) {
        if (r.end === null) return;
        lines.push((i + 1) + ' | ' + servePrefix(r) + formatTime(r.start) + ' - ' + winnerPrefix(r) + formatTime(r.end) + (r.let ? ' let' : ''));
      });

      if (lines.length === 0) {
        flashCopyBtn('Nothing to copy');
        return;
      }
      copyText(lines.join('\n')).then(function (ok) {
        flashCopyBtn(ok ? 'Copied!' : 'Copy failed');
      });
    });

    function flashCopyBtn(msg) {
      copyBtn.textContent = msg;
      setTimeout(function () { copyBtn.textContent = 'Copy List'; }, 1500);
    }

    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return false; });
      }
      return new Promise(function (resolve) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          resolve(ok);
        } catch (e) {
          resolve(false);
        }
      });
    }

    renderTable();
  </script>
